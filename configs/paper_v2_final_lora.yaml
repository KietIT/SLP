suite_version: paper_v2_final_lora_suite_v1

# The portable benchmark may be built before lambda selection. Fill every
# REQUIRED_AFTER_* digest when materializing the runtime config; final LoRA
# roles remain authorized exclusively by the later decision/method locks.
protocol:
  formal: true
  final_test_unlocked: true
  split_lock: outputs/paper_v2/protocol/split_lock.json
  expected_split_lock_sha256: REQUIRED_AFTER_SPLIT_LOCK
  decision_lock: outputs/paper_v2/protocol/best_lambda_decision.json
  expected_decision_lock_sha256: REQUIRED_AFTER_DECISION
  method_lock: outputs/paper_v2/protocol/method_lock.json
  expected_method_lock_sha256: REQUIRED_AFTER_METHOD_LOCK
  method_config: configs/phat/lambda_0.yaml
  noise_split_lock: outputs/paper_v2/protocol/noise_split_lock.json
  expected_noise_split_lock_sha256: REQUIRED_AFTER_NOISE_LOCK
  final_benchmark_lock: outputs/paper_v2/protocol/final_benchmark_lock.json
  expected_final_benchmark_lock_sha256: REQUIRED_AFTER_FINAL_BENCHMARK

benchmark:
  manifest: outputs/paper_v2/benchmark/final_benchmark_manifest.jsonl
  expected_manifest_sha256: REQUIRED_AFTER_FINAL_BENCHMARK
  expected_rows: 2300
  verify_audio_sha256: true

runtime:
  device: auto
  # Set true for the strongest method-data preflight. False still verifies the
  # decision/method identities and all 2,300 portable benchmark audio hashes.
  verify_method_audio_sha256: false

output:
  directory: outputs/paper_v2/final_predictions
  aggregate_filename: final_lora_results.csv
