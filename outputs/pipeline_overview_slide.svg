<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#4B5563"/>
    </marker>
  </defs>

  <style>
    .title { font: 700 38px 'Segoe UI', Arial, sans-serif; fill: #111827; }
    .subtitle { font: 400 21px 'Segoe UI', Arial, sans-serif; fill: #4B5563; }
    .section { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #374151; letter-spacing: 0.4px; }
    .box-title { font: 700 23px 'Segoe UI', Arial, sans-serif; fill: #111827; }
    .box-text { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #374151; }
    .small { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #4B5563; }
    .arrow { stroke: #4B5563; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    .thin-arrow { stroke: #6B7280; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .box { fill: #F9FAFB; stroke: #6B7280; stroke-width: 1.6; }
    .source { fill: #EFF6FF; stroke: #3B82F6; stroke-width: 1.8; }
    .noise { fill: #ECFDF5; stroke: #059669; stroke-width: 1.8; }
    .benchmark { fill: #F5F3FF; stroke: #7C3AED; stroke-width: 1.8; }
    .experiment { fill: #FFFFFF; stroke: #374151; stroke-width: 1.7; }
    .output { fill: #F3F4F6; stroke: #111827; stroke-width: 1.8; }
  </style>

  <text x="80" y="78" class="title">Vietnamese ASR Experiment Pipeline</text>
  <text x="80" y="114" class="subtitle">VIVOS clean speech + MUSAN noise -> benchmark construction -> three model experiments -> six-metric comparison</text>

  <!-- Data sources -->
  <rect x="120" y="175" width="310" height="105" rx="6" class="source"/>
  <text x="145" y="210" class="section">DATA SOURCE</text>
  <text x="145" y="243" class="box-title">VIVOS</text>
  <text x="145" y="268" class="box-text">Clean Vietnamese speech + transcript</text>

  <rect x="1170" y="175" width="310" height="105" rx="6" class="noise"/>
  <text x="1195" y="210" class="section">NOISE SOURCE</text>
  <text x="1195" y="243" class="box-title">MUSAN</text>
  <text x="1195" y="268" class="box-text">Only the noise subset is used</text>

  <!-- Manifest layer -->
  <path class="arrow" d="M275 280 L275 340"/>
  <path class="arrow" d="M1325 280 L1325 340"/>

  <rect x="110" y="340" width="330" height="118" rx="6" class="box"/>
  <text x="135" y="376" class="section">CLEAN MANIFESTS</text>
  <text x="135" y="411" class="box-title">VIVOS ASR JSONL</text>
  <text x="135" y="438" class="box-text">train / dev / test</text>

  <rect x="1160" y="340" width="330" height="118" rx="6" class="box"/>
  <text x="1185" y="376" class="section">NOISE MANIFEST</text>
  <text x="1185" y="411" class="box-title">MUSAN noise JSONL</text>
  <text x="1185" y="438" class="box-text">Noise paths and metadata</text>

  <!-- Benchmark -->
  <path class="arrow" d="M440 399 C540 399, 610 399, 690 399"/>
  <path class="arrow" d="M1160 399 C1060 399, 990 399, 910 399"/>

  <rect x="660" y="337" width="280" height="125" rx="6" class="benchmark"/>
  <text x="685" y="374" class="section">BENCHMARK</text>
  <text x="685" y="408" class="box-title">Noisy VIVOS test set</text>
  <text x="685" y="435" class="box-text">Clean speech mixed with noise</text>
  <text x="685" y="459" class="small">SNR: 20 / 10 / 5 / 0 dB</text>

  <!-- Experiments -->
  <path class="arrow" d="M275 458 L275 565"/>
  <path class="thin-arrow" d="M440 430 C540 505, 560 535, 645 595"/>
  <path class="arrow" d="M800 462 L800 565"/>
  <path class="thin-arrow" d="M940 430 C1065 505, 1085 535, 1155 595"/>
  <path class="arrow" d="M1325 458 L1325 565"/>

  <rect x="95" y="565" width="360" height="105" rx="6" class="experiment"/>
  <text x="120" y="601" class="section">EXPERIMENT 1</text>
  <text x="120" y="635" class="box-title">Whisper-base zero-shot</text>
  <text x="120" y="660" class="box-text">General ASR baseline</text>

  <rect x="620" y="565" width="360" height="105" rx="6" class="experiment"/>
  <text x="645" y="601" class="section">EXPERIMENT 2</text>
  <text x="645" y="635" class="box-title">PhoWhisper zero-shot</text>
  <text x="645" y="660" class="box-text">Vietnamese ASR baseline</text>

  <rect x="1145" y="565" width="360" height="105" rx="6" class="experiment"/>
  <text x="1170" y="601" class="section">EXPERIMENT 3</text>
  <text x="1170" y="635" class="box-title">PhoWhisper tone-aware LoRA</text>
  <text x="1170" y="660" class="box-text">LoRA fine-tuning + tone head</text>

  <!-- Scoring -->
  <path class="thin-arrow" d="M275 670 C365 730, 535 755, 675 755"/>
  <path class="arrow" d="M800 670 L800 728"/>
  <path class="thin-arrow" d="M1325 670 C1235 730, 1065 755, 925 755"/>

  <rect x="650" y="728" width="300" height="76" rx="6" class="output"/>
  <text x="800" y="760" text-anchor="middle" class="box-title">Six-metric scoring</text>
  <text x="800" y="785" text-anchor="middle" class="small">WER / CER / TER / DER / FCER / SWDR</text>

  <path class="arrow" d="M950 766 L1085 766"/>

  <rect x="1105" y="728" width="365" height="76" rx="6" class="output"/>
  <text x="1288" y="760" text-anchor="middle" class="box-title">Final comparison table</text>
  <text x="1288" y="785" text-anchor="middle" class="small">outputs/model_comparison_6metrics.csv</text>

  <!-- Footer note -->
  <line x1="80" y1="845" x2="1520" y2="845" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="80" y="875" class="small">All models are evaluated on the same clean and noisy manifests. Lower metric values indicate better ASR performance.</text>
</svg>
