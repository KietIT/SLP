seed: 42
model:
  name_or_path: vinai/PhoWhisper-base
  language: vi
  task: transcribe
  lora:
    r: 8
    lora_alpha: 16
    lora_dropout: 0.05
    target_modules:
    - q_proj
    - v_proj
training:
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0001
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  max_audio_seconds: 15.0
  max_label_length: 192
  mixed_precision: fp16
  gradient_checkpointing: true
  deterministic: true
  num_workers: 0
  save_steps: 500
  log_steps: 10
  tone_label_policy: last_subtoken
  lambda_tone: 0.5
  output_dir: outputs\phat\smoke\checkpoints\ckpt_tone_lora_lambda_05
  max_train_samples: 1
  max_train_steps: 1
data:
  train_manifest: data/manifests/vivos/train.jsonl
  valid_manifest: data/manifests/vivos/dev.jsonl
  sample_rate: 16000
noise:
  enable_train_noise: true
  noise_manifest: data/manifests/noise/musan_noise.jsonl
  snr_choices:
  - 20
  - 10
  - 5
  - 0
  prob: 0.7
evaluation:
  manifest: outputs/benchmark/benchmark_manifest.csv
  max_new_tokens: 128
  sample_rate: 16000
  max_audio_seconds: 15.0
  prediction_path: outputs/phat/predictions/pred_tone_lora_lambda_05.csv
selection:
  low_snr:
  - 0
  - 5
  ter_weight: 0.5
  der_weight: 0.5
  max_wer_absolute_increase: 0.05
  max_cer_absolute_increase: 0.03
  guard_split: all
  guard_snr: all
  allow_lambda_zero: true
experiment:
  id: phowhisper_base_tone_lora_lambda_05
  train_type: tone_aware_lora
logging:
  file: outputs\phat\smoke\checkpoints\ckpt_tone_lora_lambda_05\training.log
  metrics_csv: outputs\phat\smoke\checkpoints\ckpt_tone_lora_lambda_05\training_metrics.csv
